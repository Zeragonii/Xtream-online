services:
  xtream-online:
    image: ghcr.io/zeragonii/xtream-online:edge
    container_name: xtream-online
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - xtream-online-data:/data
    environment:
      TZ: Europe/London
      MAX_ACTIVE_STREAMS: "1"
      SESSION_IDLE_TIMEOUT: "35"
      FFMPEG_MODE: auto
      PROVIDER_RELEASE_DELAY: "0.5"
      CATALOG_REFRESH_INTERVAL: "900"
      UPDATE_CHECK_ENABLED: "true"
      UPDATE_CHECK_INTERVAL: "900"
      # UPDATE_CHECK_ENABLED can be set to "false" for a fully offline UI.
      # Optional override if a provider advertises an unusual stream host/port.
      # XTREAM_STREAM_BASE_URL: http://provider.example:80
      # Optional: configure the provider without using the setup page.
      # XTREAM_URL: http://provider.example:8080
      # XTREAM_USERNAME: username
      # XTREAM_PASSWORD: password
      # XTREAM_OUTPUT: ts

volumes:
  xtream-online-data:
